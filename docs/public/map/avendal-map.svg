<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <pattern id="parchment" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#f2e6c9" />
      <circle cx="1" cy="1" r="0.4" fill="#e8d9ab" opacity="0.5" />
    </pattern>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="url(#parchment)" />
  <rect x="8" y="8" width="984" height="684" fill="none" stroke="#8a6f3d" stroke-width="4" />

  <!-- Sundering River -->
  <path d="M 640 0 C 600 120, 660 220, 610 320 S 560 480, 600 700"
        fill="none" stroke="#7fa8c9" stroke-width="14" stroke-linecap="round" opacity="0.85" />

  <!-- Whispering Woods -->
  <g fill="#5c8a52" opacity="0.9">
    <circle cx="180" cy="180" r="34" />
    <circle cx="230" cy="150" r="28" />
    <circle cx="260" cy="210" r="30" />
    <circle cx="200" cy="240" r="26" />
    <circle cx="140" cy="220" r="24" />
  </g>

  <!-- Stonepeak Mountains -->
  <g fill="#8a7a68" stroke="#5c4f42" stroke-width="2">
    <polygon points="700,190 740,110 780,190" />
    <polygon points="760,195 810,90 860,195" />
    <polygon points="820,190 855,130 890,190" />
  </g>

  <!-- Blackmire Swamp -->
  <g fill="#5f6b4a" opacity="0.7">
    <ellipse cx="300" cy="520" rx="70" ry="34" />
    <ellipse cx="380" cy="550" rx="50" ry="26" />
  </g>

  <!-- Avendal City -->
  <g transform="translate(500 385)">
    <circle r="26" fill="#c9a15a" stroke="#8a6f3d" stroke-width="3" />
    <rect x="-10" y="-10" width="8" height="14" fill="#8a6f3d" />
    <rect x="2" y="-6" width="8" height="10" fill="#8a6f3d" />
  </g>

  <text x="500" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#4a3c22">Avendal</text>
  <text x="205" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3a4a30">Whispering Woods</text>
  <text x="790" y="215" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#4a3c22">Stonepeak Mountains</text>
  <text x="340" y="590" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3a4a30">Blackmire Swamp</text>
  <text x="660" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3a5a70">Sundering River</text>
</svg>
